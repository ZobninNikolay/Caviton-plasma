input:
  level4_profile_csv: outputs/level4_profile_nominal_1p5.csv
  level4_scenarios_csv: outputs/level4_scenarios.csv
  level4_history_csv: outputs/level4_history_nominal_1p5.csv

operating_point:
  pressure_Pa: 0.050
  absorbed_power_W: 15.0
  electron_temperature_eV: 6.519578
  ion_temperature_eV: 0.10
  electron_density_m3: 1.621201e16
  neutral_temperature_K: 300.0
  neutral_mass_u: 4.028

ion_species:
  - {name: Dplus, fraction: 0.10, mass_u: 2.014, deuterons_per_ion: 1}
  - {name: D2plus, fraction: 0.10, mass_u: 4.028, deuterons_per_ion: 2}
  - {name: D3plus, fraction: 0.80, mass_u: 6.042, deuterons_per_ion: 3}

field_closure:
  carrier_frequency_Hz: 1.224690e9
  pump_field_Vm: 4174.4332
  bridge_96_to_121_duration_s: 2.48e-8
  density_smoothing_sigma_cells: 3.0
  minimum_electron_density_fraction: 0.05
  sheath_drop_Te_multiplier: 3.0
  sheath_width_m: 0.002
  maximum_allowed_slow_field_Vm: 5.0e4

collisions:
  ion_neutral_momentum_rate_s-1: 3.443836e4
  charge_exchange_rate_s-1: 1.033151e5
  ionization_rate_s-1: 4.338013e4
  recombination_rate_at_n0_s-1: 1.621201e3
  wall_loss_rate_s-1: 4.338013e4

numerics:
  macro_particles: 60000
  radial_cells: 192
  time_step_s: 5.0e-10
  maximum_time_s: 6.0e-7
  field_update_steps: 2
  collision_update_steps: 2
  record_interval_s: 1.0e-8
  random_seed: 20260809
  spectrum_energy_bounds_eV: [1.0e-3, 1.0e5]
  spectrum_bins: 160
  tail_thresholds_eV: [100.0, 1000.0, 10000.0, 100000.0]

scenarios:
  - name: from96_fast_burnout
    random_seed_offset: 0
    start_profile: minimum_scale
    burnout_time_s: 1.0e-8
    ponderomotive_scale: 1.0
    collisions_enabled: true
    chemistry_enabled: true
    magnetic_field_T: 0.0
  - name: from121_fast_burnout
    random_seed_offset: 1000
    start_profile: physical_cutoff
    burnout_time_s: 1.0e-8
    ponderomotive_scale: 1.0
    collisions_enabled: true
    chemistry_enabled: true
    magnetic_field_T: 0.0
  - name: from121_collisional_decay
    random_seed_offset: 2000
    start_profile: physical_cutoff
    burnout_time_s: 5.167e-7
    ponderomotive_scale: 1.0
    collisions_enabled: true
    chemistry_enabled: true
    magnetic_field_T: 0.0
  - name: from121_sustained_upper
    random_seed_offset: 3000
    start_profile: physical_cutoff
    burnout_time_s: 5.0e-6
    ponderomotive_scale: 1.0
    collisions_enabled: false
    chemistry_enabled: false
    magnetic_field_T: 0.0
  - name: from121_B10mT
    random_seed_offset: 2000
    start_profile: physical_cutoff
    burnout_time_s: 5.167e-7
    ponderomotive_scale: 1.0
    collisions_enabled: true
    chemistry_enabled: true
    magnetic_field_T: 0.010
  - name: pressure_only_control
    random_seed_offset: 2000
    start_profile: physical_cutoff
    burnout_time_s: 1.0e-8
    ponderomotive_scale: 0.0
    collisions_enabled: true
    chemistry_enabled: true
    magnetic_field_T: 0.0

convergence_study:
  scenario: from121_collisional_decay
  cases:
    - {macro_particles: 20000, time_step_s: 1.0e-9}
    - {macro_particles: 40000, time_step_s: 5.0e-10}
    - {macro_particles: 80000, time_step_s: 2.5e-10}
