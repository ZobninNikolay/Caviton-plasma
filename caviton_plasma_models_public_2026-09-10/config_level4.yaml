input:
  level2_config: config_level2.yaml
  level2_core_csv: outputs/level2_dispersion_core.csv
  level3_threshold_csv: outputs/level3_threshold_map.csv
  level3_nonlinear_csv: outputs/level3_nonlinear_runs.csv

operating_point:
  composition: molecular_nominal
  pressure_Pa: 0.050
  absorbed_power_W: 15.0
  ion_temperature_eV: 0.10
  k_lambda_De: 0.210

geometry:
  radial_domain_m: 0.050
  initial_caviton_scale_m: 0.025
  initial_density_depletion_fraction: 0.05

physics:
  # K_in from level 1 is interpreted as the unresolved total ion-neutral
  # momentum-transfer rate; this fraction is reported as charge exchange.
  charge_exchange_fraction_of_nu_in: 0.75
  ion_neutral_rate_scale: 1.0
  langmuir_sideband_damping_scale: 1.0
  ionization_rate_scale: 1.0
  recombination_coefficient_m3s: 1.0e-13
  wall_loss_rate_scale: 1.0
  density_diffusivity_m2s: 0.05
  ion_viscosity_m2s: 0.05
  axial_magnetic_field_T: 0.0
  background_outflow_edge_ms: 0.0
  ion_acoustic_drift_growth_s-1: 0.0

pump:
  field_factor: 1.50
  maintained: true

boundary:
  sponge_start_fraction: 0.82
  maximum_sponge_rate_s-1: 3.0e6

numerics:
  radial_cells: 192
  time_step_s: 2.0e-10
  maximum_time_s: 5.0e-6
  record_interval_s: 2.0e-9
  kinetic_cutoff_Debye_lengths: 20.0
  density_floor_fraction: 0.10
  minimum_collapse_compression: 2.0
  minimum_peak_field_gain: 1.25

scenarios:
  - name: ideal_1p5
    field_factor: 1.50
    maintained_pump: true
    langmuir_damping_scale: 0.0
    ion_neutral_rate_scale: 0.0
    chemistry_enabled: false
    boundary_sponge_enabled: false
    magnetic_field_T: 0.0
    outflow_edge_ms: 0.0
    drift_growth_s-1: 0.0
  - name: nominal_1p25
    field_factor: 1.25
  - name: nominal_1p5
    field_factor: 1.50
  - name: nominal_2p0
    field_factor: 2.00
  - name: full_B10mT_flow200
    field_factor: 1.50
    magnetic_field_T: 0.010
    outflow_edge_ms: 200.0
  - name: drift_assisted_1p5
    field_factor: 1.50
    drift_growth_s-1: 5.0e4
  - name: free_decay_1p5
    field_factor: 1.50
    maintained_pump: false

convergence_study:
  scenario: nominal_1p5
  cases:
    - {radial_cells: 96, time_step_s: 4.0e-10}
    - {radial_cells: 192, time_step_s: 2.0e-10}
    - {radial_cells: 384, time_step_s: 1.0e-10}
