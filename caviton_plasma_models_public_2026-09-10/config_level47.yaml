input:
  extrema_summary_csv: outputs/extrema_summary.csv
  selected_regime: practical_extended_window

experiment:
  pulse_duration_s: 2.0e-5
  local_observation_duration_s: 1.5e-5
  absorbed_power_W: 59.291345
  drive_frequencies_Hz: [5.0e5, 1.0e6, 2.0e6, 5.0e6, 1.0e7]
  coherent_power_fractions: [0.01, 0.03, 0.10, 0.30]
  target_energy_eV: 1000.0
  chamber_length_m: 0.311831
  radius_m: 0.0955484

plasma:
  electron_temperature_cold_eV: 8.072408
  electron_temperature_hot_eV: 300.0
  hot_electron_fraction: 0.01236
  ion_temperature_eV: 0.10
  density_scan_m3: [8.0e14, 3.0e15, 1.0e16, 3.996743e16]
