geometry:
  radius_m: 0.050
  length_m: 0.250
  interaction_length_m: 0.050
  wall_transmission_factor: 0.050

gas:
  species: D2
  neutral_temperature_K: 300.0
  dominant_ion: D+
  ion_mass_u: 2.014
  neutral_mass_u: 4.028

cross_sections:
  e_momentum: data/cross_sections/e_D2_momentum_screening.csv
  ionization: data/cross_sections/e_D2_ionization_screening.csv
  dissociation: data/cross_sections/e_D2_dissociation_screening.csv
  excitation: data/cross_sections/e_D2_excitation_screening.csv
  ion_momentum: data/cross_sections/Dplus_D2_momentum_screening.csv

scan:
  pressure_Pa: [0.05, 0.075, 0.10, 0.15, 0.20, 0.30, 0.50, 0.75, 1.00]
  absorbed_power_W: [1.0, 2.0, 3.0, 5.0, 8.0, 12.0, 20.0, 30.0, 50.0]
  ion_temperature_eV: [0.05, 0.10, 0.20, 0.30]
  k_lambda_De: [0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25, 0.275, 0.30]

# Second iteration around the conservative intersection found by the coarse scan.
refinement:
  pressure_Pa: [0.050, 0.055, 0.060, 0.065, 0.070, 0.075, 0.080]
  absorbed_power_W: [8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 14.0, 15.0, 16.0, 17.0, 18.0]
  ion_temperature_eV: [0.05, 0.10, 0.20, 0.30]
  k_lambda_De: [0.160, 0.165, 0.170, 0.175, 0.180, 0.185, 0.190, 0.195, 0.200, 0.205, 0.210, 0.215, 0.220, 0.225, 0.230, 0.235, 0.240]

global_model:
  electron_temperature_bounds_eV: [1.5, 15.0]
  electron_density_bounds_m3: [3.0e+15, 3.0e+16]
  electron_temperature_acceptance_eV: [3.0, 8.0]
  ionization_energy_eV: 15.43
  dissociation_energy_eV: 4.50
  effective_excitation_energy_eV: 10.0
  wall_energy_loss_Te_factor: 2.50
  absorbed_fraction_bounds: [0.03, 0.30]
  available_generator_power_W: [100.0, 800.0]

wave_acceptance:
  min_langmuir_Q: 20.0
  min_ion_acoustic_Q: 5.0
  min_langmuir_amplitude_lengths_per_interaction: 2.0
  caviton_wavelengths: 3.0
  min_ion_acoustic_amplitude_lengths_per_caviton: 2.0
  min_plasma_parameter: 1000.0
  max_ionization_fraction: 0.05

uncertainty:
  electron_momentum_sigma_scale: [0.7, 1.3]
  ion_momentum_sigma_scale: [0.5, 2.0]
  wall_transmission_scale: [0.6, 1.6]
  scenarios:
    - {name: nominal_Dplus, ion_mass_u: 2.014, electron_sigma_scale: 1.0, ion_sigma_scale: 1.0, wall_scale: 1.0}
    - {name: low_collision_Dplus, ion_mass_u: 2.014, electron_sigma_scale: 0.7, ion_sigma_scale: 0.5, wall_scale: 0.6}
    - {name: high_collision_Dplus, ion_mass_u: 2.014, electron_sigma_scale: 1.3, ion_sigma_scale: 2.0, wall_scale: 1.6}
    - {name: nominal_D3plus_proxy, ion_mass_u: 6.042, electron_sigma_scale: 1.0, ion_sigma_scale: 1.0, wall_scale: 1.0}
    - {name: conservative_D3plus_proxy, ion_mass_u: 6.042, electron_sigma_scale: 1.3, ion_sigma_scale: 2.0, wall_scale: 1.6}
