input:
  level2_config: config_level2.yaml
  level2_core_csv: outputs/level2_dispersion_core.csv
  final_regimes_csv: outputs/level2_final_regimes_accepted.csv

zakharov:
  interaction_length_m: 0.050
  maximum_modulation_to_carrier_k: 0.35
  discrete_modulation_modes: true
  operating_field_factor: 1.50
  density_seed_fraction: 1.0e-3
  caviton_onset_depletion_fraction: 0.05

nonlinear_validation:
  enabled: true
  composition: molecular_nominal
  pressure_Pa: 0.050
  absorbed_power_W: 15.0
  ion_temperature_eV: 0.10
  k_lambda_De: 0.210
  field_factors: [1.25, 1.50, 2.00]
  reference_field_factor: 1.50
  envelope_seed_fraction: 0.01
  density_seed_fraction: 1.0e-3
  caviton_onset_depletion_fraction: 0.05
  grid_points: 128
  time_step_s: 1.0e-9
  maximum_time_s: 1.0e-5
  record_every_steps: 10
  two_thirds_dealiasing: true
  maintained_mean_pump: true

convergence_study:
  enabled: true
  field_factor: 1.50
  cases:
    - {grid_points: 64, time_step_s: 2.0e-9}
    - {grid_points: 128, time_step_s: 1.0e-9}
    - {grid_points: 256, time_step_s: 5.0e-10}
